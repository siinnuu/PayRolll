{% extends "base.html" %}

{% block title %}404 - Page Not Found | Employee Payroll Management System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="glass-card p-5">
            <div class="display-1 fw-extrabold text-primary mb-3">404</div>
            <h3 class="fw-bold text-main mb-2">Page Not Found</h3>
            <p class="text-muted mb-4">
                The requested resource could not be found. Please check the URL or return to the system dashboard.
            </p>
            <a href="{{ url_for('core.index') }}" class="btn btn-primary px-4 py-2 rounded-3">
                <i class="bi bi-house-door me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
